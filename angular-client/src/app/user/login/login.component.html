<div class="container mt-4">
  <div class="row">
    <!-- /.col-*-6 -->
    <div class="col-md-6">
      <h3 class="mb-4">Welcome!</h3>
      <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
        {{ errorMessage }}
      </div>
      <form #loginForm="ngForm" (ngSubmit)="loginClicked(loginForm.value)">
        <div class="form-group mb-3">
          <input
            name="email"
            type="email"
            class="form-control form-control-lg"
            placeholder="Email"
            ngModel
            required
            email
            #emailInput="ngModel"
          />
          <div
            *ngIf="emailInput.invalid && emailInput.touched"
            class="alert alert-danger"
          >
            <div *ngIf="emailInput.errors?.['required']">
              Email is required.
            </div>
            <div *ngIf="emailInput.errors?.['email']">
              Please enter a valid email.
            </div>
          </div>
        </div>
        <div class="form-group mb-3">
          <input
            name="password"
            type="password"
            class="form-control form-control-lg"
            placeholder="Password"
            ngModel
            required
            #passwordInput="ngModel"
          />
          <div
            *ngIf="passwordInput.invalid && passwordInput.touched"
            class="alert alert-danger"
          >
            Password is required.
          </div>
        </div>
        <p class="text-center mt-4">
          <button
            [disabled]="!loginForm.valid"
            class="btn btn-default btn-block btn-lg btn-inverse"
            type="submit"
          >
            <i class="fas fa-sign-in-alt"></i> Login
          </button>
        </p>
      </form>

      <p class="text-center clear">
        New to the chattiness?
        <a class="link-underline" routerLink="../register">Register</a>
      </p>
    </div>
  </div>
</div>
