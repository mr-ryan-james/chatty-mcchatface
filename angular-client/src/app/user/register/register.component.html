<div class="container">
  <div class="row">
    <!-- /.col-*-6 -->
    <div class="col-md-6">
      <h3>I'm the one who knocks</h3>
      <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
        {{ errorMessage }}
      </div>
      <form
        #registerForm="ngForm"
        (ngSubmit)="registerClicked(registerForm.value)"
      >
        <div class="form-group">
          <input
            name="email"
            type="email"
            class="form-control form-control-lg"
            placeholder="Email"
            ngModel
            required
            email
            #emailInput="ngModel"
          />
          <div
            *ngIf="
              emailInput.invalid && (emailInput.dirty || emailInput.touched)
            "
            class="alert alert-danger"
          >
            <div *ngIf="emailInput.errors?.['required']">
              Email is required.
            </div>
            <div *ngIf="emailInput.errors?.['email']">
              Please enter a valid email.
            </div>
          </div>
        </div>
        <div class="form-group">
          <input
            name="password"
            type="password"
            class="form-control form-control-lg"
            placeholder="Password"
            ngModel
            required
            minlength="6"
            #passwordInput="ngModel"
          />
          <div
            *ngIf="
              passwordInput.invalid &&
              (passwordInput.dirty || passwordInput.touched)
            "
            class="alert alert-danger"
          >
            <div *ngIf="passwordInput.errors?.['required']">
              Password is required.
            </div>
            <div *ngIf="passwordInput.errors?.['minlength']">
              Password must be at least 6 characters.
            </div>
          </div>
        </div>
        <div class="form-group">
          <input
            name="firstName"
            type="text"
            class="form-control form-control-lg"
            placeholder="First name"
            ngModel
            required
            #firstNameInput="ngModel"
          />
          <div
            *ngIf="
              firstNameInput.invalid &&
              (firstNameInput.dirty || firstNameInput.touched)
            "
            class="alert alert-danger"
          >
            First name is required.
          </div>
        </div>
        <div class="form-group">
          <input
            name="lastName"
            type="text"
            class="form-control form-control-lg"
            placeholder="Last name"
            ngModel
            required
            #lastNameInput="ngModel"
          />
          <div
            *ngIf="
              lastNameInput.invalid &&
              (lastNameInput.dirty || lastNameInput.touched)
            "
            class="alert alert-danger"
          >
            Last name is required.
          </div>
        </div>
        <p class="text-center">
          <button
            [disabled]="!registerForm.valid"
            class="btn btn-default btn-block btn-lg btn-inverse"
            type="submit"
          >
            <i class="fa fa-lock"></i> Come On In
          </button>
        </p>
      </form>

      <p class="text-center clear">
        Gotten chatty before?
        <a class="link-underline" routerLink="../login">Login</a>
      </p>
    </div>
  </div>
</div>
